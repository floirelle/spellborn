<!doctype html>
<html lang="en" data-theme="night">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css"><title>Meter</title></head>
<body>
<div class="sb-stack" style="max-width:420px">
  <div class="sb-meter" role="meter" aria-label="HP" aria-valuemin="0" aria-valuemax="120" aria-valuenow="84"><span class="sb-meter__label">HP</span><div class="sb-meter__track"><div class="sb-meter__fill" style="width:70%"></div></div><span class="sb-meter__value">84 / 120</span></div>
  <div class="sb-meter sb-meter--focus" role="meter" aria-label="Focus" aria-valuemin="0" aria-valuemax="12" aria-valuenow="9"><span class="sb-meter__label">Focus</span><div class="sb-meter__track"><div class="sb-meter__fill" style="width:75%"></div></div><span class="sb-meter__value">9 / 12</span></div>
  <div class="sb-meter sb-meter--low" role="meter" aria-label="HP, low" aria-valuemin="0" aria-valuemax="140" aria-valuenow="31"><span class="sb-meter__label">HP</span><div class="sb-meter__track"><div class="sb-meter__fill" style="width:22%"></div></div><span class="sb-meter__value">31 / 140</span></div>
</div>
</body>
</html>
